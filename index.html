<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
       
        <title>Planet</title>
        <!-- To do: Favicon from Logo -->

        <meta name="description" content="Hajime - Frontend capstone project">
        <meta name="author" content="Group 20">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/search.css">
        <link rel="stylesheet" href="css/planet-profile.css">
        <link rel="stylesheet" href="css/table.css">
        <link rel="stylesheet" href="css/footer.css">

        <script defer src="js/fetch.js"></script>
        <script defer src="js/theme.js"></script>
        <script defer src="js/planet-profile.js"></script>
        <script defer src="js/search.js"></script>
    </head>
    <body>
        <!-- Header -->
        <header>
            
        </header>

        <main>
            <section class="search">
                <!-- search section -->
            </section>

            <section class="planet-profile" id
            ="planet-profile">
                <!-- planet information -->
  <div id="pp-default" class="pp-state hidden">
    <p>Search a planet to view profile</p>
  </div>

  <div id="pp-found" class="pp-state ">
    <div id="pp-card">
      <img id="pp-image" src="images/image 26.svg" alt="Earth">
      
      <div id="pp-info">
        <h2 id="pp-name">Earth</h2>
        <p id="pp-type">Terrestrial</p>
        <p id="pp-desc">The only known planet to support life, with liquid water on its surface.</p>

        <div class="pp-stats">
          <div class="pp-stat">
            <span class="pp-label">Gravity</span>
            <span id="pp-gravity" class="pp-value">9.8</span>
          </div>
          <div class="pp-stat">
            <span class="pp-label">Mass</span>
            <span id="pp-mass" class="pp-value">0.00315</span>
          </div>
          <div class="pp-stat">
            <span class="pp-label">Period</span>
            <span id="pp-period" class="pp-value">365</span>
          </div>
        </div>

        <div class="pp-grid">
          <div class="pp-mini">
            <img src="images/Vector.svg" class="pp-icon" alt="">
            <span id="pp-temp">288</span>
          </div>
          <div class="pp-mini">
            <img src="images/Half moon.png" class="pp-icon" alt="">
            <span id="pp-moons">1</span>
          </div>
          <div class="pp-mini">
            <img src="images/Diameter.svg" class="pp-icon" alt="">
            <span id="pp-diameter">12756</span>
          </div>
          <div class="pp-mini">
            <img src="images/Company Icon.svg" class="pp-icon" alt="">
            <span id="pp-distance">149.6</span>
          </div>
        </div>
      </div>
    </div>
  </div>


  

            </section>

            <section class="data-table">
                <!-- planetary facts -->

            </section>

        </main>

        <footer>

        </footer>
    </body>
</html>
